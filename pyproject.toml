[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mensa-chan"
version = "0.1.0"
description = "A local-first terminal assistant for everyday life."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "gh0sti300" }
]
dependencies = []

[project.scripts]
mensa = "mensa_chan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
